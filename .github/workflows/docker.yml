name: Docker Image Build and Push to Docker Hub

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      # Same command used locally, so there is one way to run the suite and no
      # chance of the two drifting apart.
      - name: Run unit tests
        run: make test

      # Non blocking while the existing backlog is cleared. There is no lint
      # step before this one, so the tree carries errors nobody is watching.
      # Flip this to blocking once `make lint` comes back clean.
      - name: Lint
        run: make lint
        continue-on-error: true

  build:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: "${{ secrets.DOCKER_USER }}/${{ secrets.REPOSITORY_NAME }}"
          tags: type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: runtime-production
